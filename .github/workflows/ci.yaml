name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:
    inputs:
      force:
        description: "Force refetch all AniList data"
        type: boolean
        default: false
      ids:
        description: "Specific AniList IDs to refetch (space-separated)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout notes-web
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout notes-content submodule
        run: |
          git submodule update --init --recursive
          git -C content checkout main
          git -C content pull origin main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch AniList data
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          if [ -n "${{ inputs.ids }}" ]; then
            ARGS="$ARGS ${{ inputs.ids }}"
          fi
          node ./scripts/fetch-anilist.mjs $ARGS

      - name: Commit AniList data cache
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update anilist data cache [skip ci]"
          file_pattern: 'quartz/static/data/anilist.json'          

      - name: Build Quartz
        run: node ./quartz/bootstrap-cli.mjs build

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
