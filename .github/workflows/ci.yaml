name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout notes-web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout notes-content submodule
        run: git submodule update --init --recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore AniList image cache
        uses: actions/cache@v4
        with:
          path: public/data/anilist-images.json
          key: anilist-images-${{ hashFiles('content/**/*.md') }}
          restore-keys: |
            anilist-images-

      - name: Fetch AniList images
        run: node scripts/fetch-anilist.mjs

      - name: Build Quartz
        run: npx quartz build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
