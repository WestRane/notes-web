name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # No-history cloning on purpose
      - name: Checkout notes-web
        uses: actions/checkout@v6

      - name: Clone notes-content
        run: |
          rm -rf content
          git clone --depth 1 https://github.com/WestRane/notes-content.git content

      - name: Checkout notes-assets
        uses: actions/checkout@v6
        with:
          repository: WestRane/notes-assets
          token: ${{ secrets.ASSETS_REPO_PAT }}
          path: assets

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync banners and posters
        env:
          ASSETS_DIR: assets
        run: node ./scripts/sync-assets.mjs

      # Non-fatal on purpose
      - name: Commit and push asset changes
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: assets
          commit_message: "chore(assets): sync banners and posters"
          file_pattern: "images manifest.json"

      - name: Copy images into Quartz static
        run: |
          mkdir -p quartz/static/assets/images
          if [ -d assets/images ]; then cp -r assets/images/. quartz/static/assets/images/; fi
          if [ -f assets/manifest.json ]; then cp assets/manifest.json quartz/static/assets/manifest.json; fi

      - name: Build Quartz
        run: node ./quartz/bootstrap-cli.mjs build

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
